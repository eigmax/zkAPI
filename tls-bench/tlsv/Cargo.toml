[package]
name = "tlsv"
version = "0.1.0"
edition = "2021"
publish = false
description = "Checks a recorded TLS 1.3 session: key schedule from the client's X25519 secret, the server's certificate chain, CertificateVerify and Finished, and the application records."

[dependencies]
serde = { version = "1.0.204", features = ["derive"] }
sha2 = { version = "0.10.8", features = ["oid"] }
hmac = "0.12.1"
hkdf = "0.12.4"
aes = "0.8.4"
aes-gcm = "0.10.3"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
x509-cert = { version = "0.2.5", default-features = false }
der = { version = "0.7.9", features = ["alloc", "oid"] }
const-oid = "0.9.6"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
p384 = { version = "0.13.0", features = ["ecdsa"] }
rsa = { version = "=0.9.6", features = ["sha2"] }
